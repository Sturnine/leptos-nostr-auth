[changelog]
# Release sections only: scripts/prepare-release.sh inserts them under `## [Unreleased]`.
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""

[git]
conventional_commits = true
# Off so unconventional subjects (`Fix ...`, `Revert "..."`, `Reapply "..."`) reach the parsers.
# filter_commits drops what no parser groups (ci, chore, test, style, build, merges, ...), and
# those don't bump.
filter_unconventional = false
filter_commits        = true
tag_pattern           = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Cargo.toml `include`; a change only to the lockfile cargo also packages doesn't affect dependents.
include_paths = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

# Only merge commits are allowed, so GitHub's Revert button reverts the merge.
commit_preprocessors = [
  { pattern = '^Revert "Merge pull request (#\d+) from [^/]+/([^"]+)"', replace = 'Revert $1 ($2)' },
  # The template prints only a conventional commit's description.
  { pattern = '(?i)^revert: ', replace = 'Revert ' },
]

# HTML comments order the groups; striptags removes them from the output.
commit_parsers = [
  { field = "scope", pattern = '(?i)^(test|ci|chore|style|build)$', skip = true },
  { message = '(?i)^feat\b', group = "<!-- 0 -->Added" },
  { message = '(?i)^(perf|refactor|revert|reapply)\b', group = "<!-- 1 -->Changed" },
  # Dependabot's cargo prefix; it only reaches here when it changes Cargo.toml.
  { message = '(?i)^build\(deps\)', group = "<!-- 1 -->Changed" },
  { message = '(?i)^fix\b', group = "<!-- 2 -->Fixed" },
  { message = '(?i)^docs\b', group = "<!-- 3 -->Documentation" },
  { field = "breaking", pattern = 'true', group = "<!-- 1 -->Changed" },
]

# Matches Cargo's 0.x rules: a breaking change bumps the minor, anything else the patch.
[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
