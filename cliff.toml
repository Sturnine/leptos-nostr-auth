[changelog]
# Release sections only: scripts/prepare-release.sh inserts them under `## [Unreleased]`.
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits     = true
filter_unconventional    = true
split_commits            = false
protect_breaking_commits = false
filter_commits           = false
tag_pattern              = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits             = "oldest"
# HTML comments order the groups; striptags removes them from the output.
commit_parsers = [
  { message = '\((pa|th)-\d+\)$', skip = true },
  { message = '^chore: merge', skip = true },
  { message = '^feat', group = "<!-- 0 -->Added" },
  { message = '^(perf|refactor)', group = "<!-- 1 -->Changed" },
  { message = '^fix', group = "<!-- 2 -->Fixed" },
  { message = '^docs', group = "<!-- 3 -->Documentation" },
  { message = '^(test|ci|chore|style|build)', skip = true },
]
