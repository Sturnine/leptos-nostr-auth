[package]
name         = "leptos-nostr-auth"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.89"
description  = "Headless Nostr authentication modal widget for Leptos"
license      = "Apache-2.0"
authors      = ["Devan Looches <devan.looches@gmail.com>"]
repository   = "https://github.com/Sturnine/leptos-nostr-auth"
readme       = "README.md"
keywords     = ["nostr", "leptos", "wasm", "authentication", "login"]
categories   = ["wasm", "web-programming", "authentication"]
include      = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = []
# Raw nsec/hex private key paste — XSS risk; must be explicitly opted in
insecure_nsec_input = []

# Rendering modes — consumer enables exactly one per build target
ssr = [
  "leptos/ssr",
  "leptos-use-storage/ssr",
  "leptos-use-event-listener/ssr",
  "leptos-use-window/ssr",
]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
leptos = { version = "0.8", default-features = false }

leptos-use-storage        = "0.20"
leptos-use-event-listener = "0.20"
leptos-use-window         = "0.20"

codee = { version = "0.3", features = ["json_serde"] }

futures = { version = "0.3", default-features = false, features = ["alloc"] }

nostr = { version = "0.45.7", default-features = false, features = [
  "std",
  "nip44",
  "nip46",
  "nip49",
  "rand",
  "os-rng",
] }

bitcoin_hashes = { version = "1.2", default-features = false }

wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"

web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Window",
  "Navigator",
  "console",
  "CredentialsContainer",
  "CredentialCreationOptions",
  "CredentialRequestOptions",
  "Crypto",
  "WebSocket",
  "MessageEvent",
  "ErrorEvent",
  "BinaryType",
  "Location",
  "KeyboardEvent",
  "Storage",
  "StorageEvent",
] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
base64     = { version = "0.23", features = ["alloc"] }

thiserror = "2"

# Makes non-Send types (Rc, web-sys objects) usable in Leptos signals on WASM.
# Safe because WASM is single-threaded; SendWrapper panics on cross-thread access.
send_wrapper = { version = "0.6", features = ["futures"] }

zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# nostr 0.45 randomness (rand 0.10 -> getrandom 0.4) needs the browser backend explicitly
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
nostr = { version = "0.45.7", default-features = false, features = ["nip59"] }

[profile.dev]
opt-level = 1 # scrypt test vectors are slow at opt-level 0

[lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

unwrap_used                = "warn"
expect_used                = "warn"
panic                      = "warn"
dbg_macro                  = "warn"
todo                       = "warn"
unimplemented              = "warn"
indexing_slicing           = "warn"
str_to_string              = "warn"
implicit_clone             = "warn"
arithmetic_side_effects    = "warn"
use_debug                  = "warn"
std_instead_of_core        = "warn"
exhaustive_structs         = "warn"
exhaustive_enums           = "warn"
clone_on_ref_ptr           = "warn"
mem_forget                 = "warn"
print_stdout               = "warn"
print_stderr               = "warn"
map_err_ignore             = "warn"
try_err                    = "warn"
undocumented_unsafe_blocks = "warn"
exit                       = "warn"
tests_outside_test_module  = "warn"

module_name_repetitions = "allow" # intentional: NostrAuth* prefix throughout public API
must_use_candidate      = "allow" # Leptos components return impl IntoView
wildcard_imports        = "allow" # use leptos::prelude::* is idiomatic Leptos
unused_async            = "allow" # SSR stubs are async to match the WASM API signature
unused_async_trait_impl = "allow" # same stubs, reported on impl blocks
future_not_send         = "allow" # wasm is single-threaded, nothing requires these futures to be Send
