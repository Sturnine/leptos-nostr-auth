version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: cargo
    directories:
      - /
      - /examples/basic-csr
      - /examples/with-axum-ssr
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
