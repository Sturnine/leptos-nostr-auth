name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Cache nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'examples/*/Cargo.lock') }}
          restore-prefixes-first-match: nix-v2-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size: 2G
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Run flake checks
        run: nix flake check
      - name: Root dependency builds
        run: nix build --out-link ci-roots .#ci-roots

  package:
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_PR: ${{ github.head_ref == 'release-pr' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3 # HEAD^1 is the base branch, HEAD^2 the PR head, HEAD^2^ its parent
          persist-credentials: false
      # Merging a version change publishes it, so only the generated release PR may make one, and
      # only as generated on the current base: a branch updated from main lacks entries and bump for
      # what came in.
      - name: Check version change
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          read_version() { git show "$1:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'; }
          if [[ $RELEASE_PR == true ]]; then
            # Updating the branch on GitHub merges or rebases, changing the parent or the committer.
            if [[ $(git rev-parse HEAD^2^) != "$(git rev-parse HEAD^1)" \
              || $(git log -1 --format=%ce HEAD^2) != '41898282+github-actions[bot]@users.noreply.github.com' ]]; then
              echo "::error::the release PR is not the generated commit on main; the next push to main regenerates it, or while a release is untagged a manual Release run with its version"
              exit 1
            fi
          elif [[ $(read_version HEAD) != "$(read_version HEAD^1)" ]]; then
            echo "::error::only the release PR may change the Cargo.toml version"
            exit 1
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Package
        run: cargo package --locked
      - name: Install cargo-semver-checks
        if: ${{ env.RELEASE_PR == 'true' }}
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0
          fallback: none
      - name: Check the version bump
        if: ${{ env.RELEASE_PR == 'true' }}
        run: |
          cargo semver-checks --default-features
          cargo semver-checks --only-explicit-features --features ssr,insecure_nsec_input
