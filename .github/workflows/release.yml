name: Release

# Publish only when the release-pr branch is merged into main.
# Nothing else — no direct push, no version bump commit, no other PR — can trigger this.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release-pr' &&
      github.repository_owner == 'Sturnine'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # create the tag and GitHub release
      id-token: write  # trusted publishing to crates.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Read version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check crates.io
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            -A "leptos-nostr-auth release workflow (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/leptos-nostr-auth/$VERSION")
          case "$status" in
            200) echo "published=true"  >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::crates.io answered $status"; exit 1 ;;
          esac

      - name: Authenticate with crates.io
        if: ${{ steps.registry.outputs.published == 'false' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish to crates.io
        if: ${{ steps.registry.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" \
            'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' \
            CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
