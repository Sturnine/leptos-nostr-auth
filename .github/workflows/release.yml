name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Sturnine' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() { git show "$1:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'; }
          version=$(read_version HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only the push that changes the version releases, so a later push never ships or tags other commits.
          if [[ $version != "$(read_version "$BEFORE")" ]] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the pushed commit itself, so what merged is what ships.
  publish:
    name: Publish to crates.io
    needs: check
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to crates.io
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      # A rerun after a failed GitHub release finds the version already published.
      - name: Check crates.io
        id: registry
        run: |
          status=$(curl -s --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            -A "leptos-nostr-auth release workflow (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/leptos-nostr-auth/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Authenticate with crates.io
        if: ${{ steps.registry.outputs.published == 'false' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        if: ${{ steps.registry.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  github-release:
    name: Tag and GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
