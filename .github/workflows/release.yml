name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Sturnine' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the pushed commit itself, so what merged is what ships.
  publish:
    name: Publish to crates.io
    needs: check
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to crates.io
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Check the version bump against crates.io
        run: cargo semver-checks --default-features
      # A rerun after a failed GitHub release finds the version already published.
      - name: Check crates.io
        id: registry
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "leptos-nostr-auth release workflow (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/leptos-nostr-auth/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Authenticate with crates.io
        if: ${{ steps.registry.outputs.published == 'false' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        if: ${{ steps.registry.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  github-release:
    name: Tag and GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff@2.14.2
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git cliff --config cliff.toml --unreleased --tag "v$VERSION" --strip all > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
