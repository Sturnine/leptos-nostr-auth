[package]
name    = "basic-csr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "basic-csr"
path = "src/main.rs"

[dependencies]
leptos                   = { version = "0.8", features = ["csr"] }
leptos-nostr-auth        = { path = "../..", features = ["csr"] }
js-sys                   = "0.3"
wasm-bindgen-futures     = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 1
